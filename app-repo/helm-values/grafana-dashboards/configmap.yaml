# ArgoCD syncs this folder as raw manifests.
# Each dashboard JSON file is wrapped in its own ConfigMap below.
# The Grafana sidecar picks up ConfigMaps with label grafana_dashboard: "1".
#
# Dashboard JSON files live beside this YAML. To add a new dashboard:
#   1. Drop the .json file in this directory
#   2. Add a ConfigMap entry below referencing it
#   3. Commit — ArgoCD auto-syncs the change
#
# NOTE: Because ArgoCD syncs plain manifests (not Helm), the JSON must be
# pasted inline under the data key. Keep the JSON files as the source of
# truth and copy their contents here during updates.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Kubernetes"
data:
  cluster-overview.json: |
    SEE_cluster-overview.json
---
