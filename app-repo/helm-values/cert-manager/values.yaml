installCRDs: true

replicaCount: 1

serviceAccount:
  create: true
  name: cert-manager
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_CERT_MANAGER_ROLE_ARN

securityContext:
  fsGroup: 1001

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: monitoring
