existingObjstoreSecret: thanos-objstore-config

query:
  enabled: true
  replicaCount: 1

  dnsDiscovery:
    sidecarsService: monitoring-thanos-discovery
    sidecarsNamespace: monitoring

  stores:
    - dnssrv+_grpc._tcp.thanos-storegateway.monitoring.svc.cluster.local

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_ACM_CERT_ARN"
    hostname: thanos.example.com

queryFrontend:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

storegateway:
  enabled: true
  replicaCount: 1

  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

compactor:
  enabled: true

  retentionResolutionRaw: 30d
  retentionResolution5m: 90d
  retentionResolution1h: 365d

  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

ruler:
  enabled: false

receive:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
