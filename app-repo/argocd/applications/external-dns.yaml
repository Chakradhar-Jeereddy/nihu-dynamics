apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.15.0
    helm:
      valuesObject:
        provider:
          name: aws
        env:
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: REPLACE_WITH_EXTERNAL_DNS_ROLE_ARN
        domainFilters:
          - example.com
        policy: upsert-only
        txtOwnerId: nihu-dynamics-dev
        sources:
          - ingress
          - service
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
