name: Lint Manifests

on:
  pull_request:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200}, truthy: disable}}" \
            argocd/ helm-values/

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add harbor https://helm.goharbor.io
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      - name: Validate Helm values
        run: |
          echo "Validating kube-prometheus-stack values..."
          helm template test prometheus-community/kube-prometheus-stack \
            -f helm-values/kube-prometheus-stack/values.yaml --dry-run > /dev/null

          echo "Validating thanos values..."
          helm template test bitnami/thanos \
            -f helm-values/thanos/values.yaml --dry-run > /dev/null

          echo "Validating harbor values..."
          helm template test harbor/harbor \
            -f helm-values/harbor/values.yaml --dry-run > /dev/null

  kubeconform:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin

      - name: Validate ArgoCD manifests
        run: |
          find argocd/ -name '*.yaml' -o -name '*.yml' | \
            xargs kubeconform -strict -ignore-missing-schemas -summary
